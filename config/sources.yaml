# ============================================================
# 十六源智能日报系统 —— 来源配置
# 对应 PRD 4.1 / 4.3，端点优先级结构见实施方案 2.2
#
# 【endpoints 语义】按 priority 升序尝试，priority 1 失败才回退。
# 每轮采集都从 priority 1 重新开始，不做粘性缓存 —— PRD 18 章要求
# 「不得因为过去曾 404 而跳过抓取」。每次尝试都写审计。
#
# 【实测基线】2026-08-23 从 52.141.58.148 测得，见各源 probe 注释。
# 新增或改端点后必须跑 `node scripts/probe-sources.mjs` 更新基线。
# ============================================================

meta:
  source_version: 1
  updated_at: "2026-08-23"
  probe_baseline_date: "2026-08-23"
  probe_from_ip: "52.141.58.148"

# ------------------------------------------------------------
# 主机分组限流（实施方案 2.3）
# rsshub 组实测：单请求 0.87s 正常，连续请求退化至超时 → 强制串行 + 8s 间隔
# ------------------------------------------------------------
host_groups:
  rsshub:
    hosts: [hub.slarker.me, rsshub.rssforever.com]
    concurrency: 1
    min_interval_ms: 8000
    timeout_ms: 40000
    max_retries: 2
    note: >
      实测限流：单请求 0.87s，连续请求退化至超时。rssforever 的 telegram/jike
      路由曾整体不可用约 1 小时后自行恢复 —— 间歇性，故 slarker 置于 priority 1。
      11 次请求 × 8s 间隔实测总耗时 92.5s，与预估 60-90s 吻合。
  telegram_web:
    hosts: [t.me]
    concurrency: 2
    min_interval_ms: 1000
    timeout_ms: 20000
    max_retries: 2
  mystool:
    hosts: [mystool.me]
    concurrency: 2
    min_interval_ms: 1000
    timeout_ms: 20000
    max_retries: 2
    note: "6 个 X 源单点依赖；公共 RSSHub 的 twitter 路由实测全部 503，无替代"
  direct:
    hosts: [linuxdorss.longpink.com, elsewhere.news, api-docs.deepseek.com]
    concurrency: 2
    min_interval_ms: 1000
    timeout_ms: 20000
    max_retries: 2

# ------------------------------------------------------------
# 抓取默认值（PRD 4.4）
# ------------------------------------------------------------
defaults:
  connect_timeout_ms: 5000
  total_timeout_ms: 20000
  max_body_bytes: 5242880          # 5 MB
  user_agent: "BriefingBot/1.0 (+personal daily digest; contact via repo owner)"
  conditional_get: true            # ETag / If-None-Match / Last-Modified
  follow_redirects: 3
  assumed_timezone: Asia/Taipei    # 无时区信息时的兜底（PRD 5.4）

# ------------------------------------------------------------
# 采集节奏分档（harvest_interval_minutes）
#
# 依据 2026-08-23 实测的 feed 时间跨度。原计划统一 20 分钟 × 16 源
# = 1152 次请求/天，对间歇性失效的 rssforever 和单点的 mystool 都是
# 不必要的压力。按跨度分档后约 450 次/天，降 61%，其中 rsshub 组
# 从 432 次/天降到 192 次/天。
#
# 定档原则：
#   · 榜单型（按热度轮转，条目可能在窗口内上榜又掉榜）→ 最密，20 分钟。
#     时间跨度对榜单是弱信号，不能据此放宽。
#   · 时序型 → 取 min(跨度/6, 240) 并向下取整到档位，保证条目在滚出
#     feed 前至少被采集 6 次。
#   · 所有档位都远小于最短窗口（午报 4 小时），不影响窗口完整性。
# ------------------------------------------------------------
harvest_tiers:
  ranking_feed: 20        # 榜单型：v2ex, linuxdo
  standard: 60            # 时序型主力：telegram, jike, mystool X
  slow: 240               # 极低频：elsewhere
  official_changelog: 120 # 官方日志：deepseek

# ------------------------------------------------------------
# 16 个来源
# ------------------------------------------------------------
sources:

  - id: linuxdo
    name: LINUX DO 热门话题
    harvest_tier: ranking_feed          # 20 分钟 —— 榜单型，热度轮转
    display_name: LINUX DO
    category: forum
    enabled: true
    priority: 1
    host_group: direct
    mandatory_retention: true        # 适用强制保留 A-D（PRD 8.2）
    require_fulltext: true           # 实测 39/39 条截断，必须开原帖（规则 0b）
    endpoints:
      - { url: "https://linuxdorss.longpink.com/top.xml", parser: rss, priority: 1 }
    probe: { date: "2026-08-23", status: 200, items: 39, span_hours: 27.7, latency_s: 0.81 }

