# ============================================================
# 十六源智能日报系统 —— 规则配置
# 对应 PRD 第 7/8/9/15 章，由 PRD 21.2 要求版本化
#
# 修改本文件必须递增 meta.rule_version。历史简报通过
# briefs.rule_version 回溯到当时生效的版本（PRD 21.2）。
#
# 【设计原则】程序能算准的，不写进 AI Prompt。本文件里的
# signals / deterministic_filters 全部由代码执行；AI 只接收
# 命中结果（PRD 1.3 确定性优先、15.2 输入最小化）。
# ============================================================

meta:
  rule_version: 17
  updated_at: "2026-09-12"
  timezone: Asia/Taipei          # 全系统唯一时区基准（PRD 5.1）
  description: "初版：从 PRD V1.0 自然语言规则拆解而来，未经影子运行校准"

# ------------------------------------------------------------
# 0. 固定窗口（PRD 5.1）
#
# 三个窗口首尾相接、覆盖全天，边界严格左闭右开。
# 每个窗口在其 end 时刻发报，即简报内容 = 上一个发报时刻至本次之间。
# 改这里必须同时改 systemd timer 的 OnCalendar，两者的时刻要一致 ——
# 否则会漏掉窗口末尾到实际发报时刻之间的内容。
# ------------------------------------------------------------
windows:
  timezone: Asia/Taipei
  # 按 end 时刻升序排列；morning 跨日（前一天 evening_end → 次日 08:00）
  schedule:
    - { id: morning, label: 早报, end_hour: 8 }
    - { id: noon,    label: 午报, end_hour: 12 }
    - { id: evening, label: 晚报, end_hour: 22 }

# ------------------------------------------------------------
# 1. URL 规范化（PRD 7.2）
#    目的：让同一内容跨来源产生相同 canonical_url
# ------------------------------------------------------------
url_normalization:
  lowercase_host: true
  drop_default_port: true        # :80 / :443
  strip_fragment: true           # #anchor
  trailing_slash: strip          # 统一去掉结尾斜杠（根路径除外）
  sort_query_params: true        # 保留的参数按字典序排列，保证稳定
  max_redirects: 3               # PRD 7.2：仅白名单短链跟随，最多 3 跳

  # 追踪参数：命中即移除。prefix 为前缀匹配。
  tracking_params:
    prefix:
      - utm_
      - spm_
      - scm_
      - at_
      - pk_
      - vero_
      - hsa_
      - matomo_
      - piwik_
    exact:
      # PRD 7.2 明列
      - spm
      - from
      - source
      - ref
      # 广告平台点击 ID
      - gclid
      - dclid
      - gbraid
      - wbraid
      - fbclid
      - msclkid
      - twclid
      - yclid
      - igshid
      - ttclid
      - li_fat_id
      # 社交/分享回传
      - ref_src
      - ref_url
      - referrer
      - share_token
      - share_source
      - share_medium
      - share_plat
      - shareId
      - sharer
      - from_source
      - from_channel
      - __twitter_impression
      # 邮件营销
      - mc_cid
      - mc_eid
      - _hsenc
      - _hsmi
      - oly_anon_id
      - oly_enc_id
      # X / Twitter 分享后缀（s=20&t=xxxx 形式）
      - s
      - t
      # 其他
      - xtor
      - hss_channel
      - feature
      - si

  # 例外：某些主机上上述参数有真实语义，必须保留。
  # 优先级高于 tracking_params（PRD 7.2「来源特殊参数使用可配置保留列表」）
  preserve_params_by_host:
    "v2ex.com": [p]              # 分页
    "www.v2ex.com": [p]
    "linux.do": [page]
    "api-docs.deepseek.com": []
    "elsewhere.news": []
    "github.com": [tab, q]       # 仓库 tab 与搜索语义
    "www.youtube.com": [v, list] # v 是视频 ID，绝不能当追踪参数删掉
    "youtu.be": []

  # 短链白名单：只有这些主机才展开跳转（PRD 7.2 防 SSRF 与无限跳转）
  short_link_hosts:
    - t.co
    - bit.ly
    - tinyurl.com
    - is.gd
    - t.cn
    - dwz.cn
    - url.cn
    - s.click.taobao.com

  # 主机别名归并：不同域名指向同一实体，统一到 canonical
  host_aliases:
    "twitter.com": x.com
    "mobile.twitter.com": x.com
    "www.x.com": x.com
    "nitter.net": x.com
    "www.v2ex.com": v2ex.com
    "www.github.com": github.com

  # 稳定 topic ID 抽取（PRD 7.1 标识优先级第 1、2 层）
  # 命中后生成 source_item_key，优先级高于 GUID 与 URL
  topic_id_patterns:
    - name: linuxdo_topic
      host: linux.do
      path_regex: '^/t/(?:topic/)?(?:[^/]+/)?(\d+)'
      key_template: "linuxdo:t:{1}"
    - name: v2ex_topic
      host: v2ex.com
      path_regex: '^/t/(\d+)'
      key_template: "v2ex:t:{1}"
    - name: telegram_message
      host: t.me
      path_regex: '^/(?:s/)?([A-Za-z0-9_]{4,})/(\d+)'
      key_template: "tg:{1}:{2}"
    - name: x_status
      host: x.com
      path_regex: '^/([A-Za-z0-9_]{1,15})/status/(\d+)'
      key_template: "x:{1}:{2}"
    - name: github_repo
      host: github.com
      path_regex: '^/([^/]+)/([^/]+)/?$'
      key_template: "gh:{1}/{2}"

  # 「原始事件链接」vs「发现渠道链接」（PRD 7.2 末段）
  # 这些主机上的内容视为转述渠道，需额外抽取正文中的首个外链作为 origin_url
  discovery_channel_hosts:
    - t.me
    - x.com
    - v2ex.com
    - linux.do

# ------------------------------------------------------------
# 2. 内容指纹与版本判定（PRD 7.3）
# ------------------------------------------------------------
content_fingerprint:
  algorithm: sha256
  # 计算语义指纹前的清洗步骤，顺序执行
  normalize_steps:
    - strip_html_tags
    - collapse_whitespace
    - strip_tracking_params_in_text   # 正文内嵌链接同样去追踪参数
    - strip_zero_width                # ​-‍﻿
    - normalize_fullwidth_punctuation
    - lowercase
  # 这些「变化」不算实质更新，不得触发重发（PRD 7.3）
  ignore_patterns:
    - name: view_count
      regex: '\d+\s*(次浏览|浏览|views?|阅读|回复|replies|comments?|点赞|likes?)'
    - name: relative_time
      regex: '\d+\s*(分钟|小时|天|周|个?月|年)前|\d+\s*(minutes?|hours?|days?|weeks?|months?|years?)\s+ago'
    - name: forum_footer_counts
      description: >
        论坛 RSS 尾注「N 个帖子 - M 位参与者」。回复数随时间增长，若不剔除
        会改变内容指纹，被误判为实质更新并重复发送（实测 linux.do 39/39 条都有）。
      regex: '\d+\s*个帖子\s*[-–]\s*\d+\s*位参与者'
    - name: forum_readmore_marker
      regex: '(阅读完整话题|阅读完整主题|阅读全文|查看全文|Read more)'
    - name: edit_marker
      regex: '\(编辑于[^)]*\)|\(edited\)|最后编辑[:：].*'
    - name: pure_whitespace_or_format
      regex: '^[\s\-=*_#>|]+$'

  # 只有出现这些语义变化才允许重新入选并标记「更新」（PRD 7.3）
  substantive_update_signals:
    - name: version_number
      regex: '\bv?\d+\.\d+(\.\d+)?(-[a-z0-9.]+)?\b'
    - name: price_change
      regex: '(?:[$￥€£]|USD|CNY|RMB|人民币)\s*\d+(?:[.,]\d+)?|\d+\s*(?:美元|元|块)'
    - name: status_change
      regex: '(已下线|已上线|已发布|已停止|已恢复|停服|公测|内测|GA\b|deprecated|sunset|EOL|正式版|beta|rollout)'
    - name: policy_or_rule
      regex: '(政策|条款|规则|资格|限制|配额|额度|限免|截止|deadline|policy|terms|quota|eligibility)'
    - name: new_fact_marker
      regex: '(更新[:：]|Update[:：]|补充[:：]|勘误|correction|新增)'

# ------------------------------------------------------------
# 3. 确定性信号抽取（PRD 8.1 处理顺序中「强制保留预判」的输入）
#    这些信号由程序从正文抽取，既用于预判，也作为紧凑事实
#    传给 Luna（PRD 15.2「已抽取代码仓库/步骤/官方链接」）。
#    AI 不需要自己找这些东西。
# ------------------------------------------------------------
signals:
  repo_url:
    description: "可访问的代码仓库链接"
    url_host_any:
      - github.com
      - gitlab.com
      - bitbucket.org
      - gitee.com
      - codeberg.org
      - sourceforge.net
      - hf.co
      - huggingface.co
      - npmjs.com
      - pypi.org
      - crates.io
    # 抽到后需二次校验可达性（HEAD 请求，计入 fetch 预算）
    verify_reachable: true

  code_block:
    description: "正文含代码块或多行命令"
    # on: text（默认）| html | both —— 声明该正则作用于哪份内容。
    # 论坛正文里的代码块经 HTML→纯文本转换后围栏就没了，
    # 只测纯文本会漏掉绝大多数（实测 linux.do 100 条只认出 1 条）。
    any_of:
      - regex: '```[\s\S]{20,}?```'
      - regex: '<pre[\s\S]{20,}?</pre>'
        on: html
      - regex: '<code[^>]*>[\s\S]{20,}?</code>'
        on: html
      # 连续 2 行以上 shell 提示符
      - regex: '^\s*(?:\$|#|>)\s+\S+.*(?:\n\s*(?:\$|#|>)\s+\S+.*){1,}'
        flags: m

  command_line:
    description: "可复制执行的单条命令"
    any_of:
      - regex: '^\s*(?:sudo\s+)?(?:apt|apt-get|yum|dnf|pacman|brew|npm|pnpm|yarn|pip|pip3|uv|cargo|go|docker|docker\s+compose|kubectl|git|curl|wget|systemctl|ssh|make|bash|sh|python3?|node)\s+\S+'
        flags: m

  config_block:
    description: "配置片段（yaml/json/toml/ini/env）"
    any_of:
      - regex: '^\s*[A-Za-z_][A-Za-z0-9_]*\s*[:=]\s*\S+(?:\n\s*[A-Za-z_][A-Za-z0-9_]*\s*[:=]\s*\S+){2,}'
        flags: m
      - regex: '\{[\s\S]{40,}?"[\w-]+"\s*:[\s\S]{10,}?\}'

  step_markers:
    description: "分步骤教程结构"
    min_count: 3
    any_of:
      - regex: '^\s*(?:\d+[.、)]|第[一二三四五六七八九十]+步|Step\s*\d+)\s*\S+'
        flags: m
      - regex: '^\s*[-*+]\s+\S+'
        flags: m

  official_link:
    description: "指向官方域名的链接（用于 C 类权益核验）"
    url_host_in: official_domains        # 引用下方 official_domains 列表

  demo_link:
    description: "可验证的在线演示"
    url_host_any:
      - vercel.app
      - netlify.app
      - pages.dev
      - streamlit.app
      - hf.space
      - replit.app
      - railway.app
      - fly.dev
    or_path_regex: '/(demo|playground|preview|try)\b'

  price_mention:
    regex: '(?:[$￥€£]|USD|CNY|RMB)\s*\d+(?:[.,]\d+)?|\d+\s*(?:美元|元|块|刀)|免费|free\s+tier|试用|订阅|subscription'

  aff_link:
    description: "联盟营销/返利链接"
    any_of:
      - url_query_param_any: [aff, affid, aff_id, ref, refid, referral, referrer, inviter, invite, invitecode, invite_code, r, promo, promocode, coupon, cid, agent]
      - url_host_any:
          - dlj.tw
          - u.jd.com
          - s.click.taobao.com
          - s.click.tmall.com
          - union-click.jd.com
          - p.pinduoduo.com
          - shareasale.com
          - awin1.com
          - impact.com
          - partnerize.com
      - regex: '(返利|佣金|拉新|推广奖励|邀请奖励|分成|赚取积分)'

  invite_code:
    any_of:
      - regex: '(?:邀请码|邀请碼|invite\s*code|referral\s*code|promo\s*code|优惠码|兑换码|激活码)\s*[:：是为]?\s*[A-Za-z0-9_-]{4,32}'
      - regex: '(?:填写|使用|输入)\s*(?:我的)?\s*(?:邀请码|优惠码|推荐码)'

  external_link:
    description: "正文含指向站外的绝对 HTTPS 链接"
    min_count: 1
    exclude_hosts_same_as_source: true    # 站内链接不计数

  install_hint:
    description: "安装或使用说明（A 类在无仓库链接时的替代证据）"
    any_of:
      - regex: '(安装|部署|使用方法|快速开始|上手|installation|getting\s+started|quick\s*start|usage|how\s+to\s+use)'
        flags: i
      - regex: '(clone|install|运行以下|执行以下|依赖要求|requirements?\.txt|package\.json|docker-compose\.ya?ml)'
        flags: i

  policy_mention:
    description: "服务政策/资格规则/功能变化（C 类判定用）"
    any_of:
      - regex: '(政策|条款|规则|资格|门槛|配额|额度|限制|白名单|灰度|上线|下线|停止支持|迁移公告)'
        flags: i
      - regex: '(policy|terms|eligibility|quota|deprecat|sunset|rollout|availability)'
        flags: i

