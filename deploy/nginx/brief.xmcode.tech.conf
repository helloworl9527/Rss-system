# 十六源智能日报后台 Nginx 反向代理
# 安装到 /etc/nginx/sites-available/brief.xmcode.tech.conf，
# 并链接到 /etc/nginx/sites-enabled/。

upstream briefing_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name brief.xmcode.tech;

    # ACME HTTP-01 与所有明文请求统一跳转 HTTPS。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location ^~ /rss/ {
        access_log off;
        error_log /dev/null;
        return 404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brief.xmcode.tech;

    ssl_certificate     /etc/letsencrypt/live/brief.xmcode.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brief.xmcode.tech/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Fastify 已设置 CSP；Nginx 不覆盖它，避免产生两套策略。
    location = /health/live {
        access_log off;
        proxy_pass http://briefing_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /rss/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://briefing_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://briefing_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 256k;
    }
}
